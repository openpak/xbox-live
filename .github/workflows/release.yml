name: release

# Tag vX.Y.Z (or run manually) to publish one image per Go service:
# ghcr.io/openpak/xb-<name>:{X.Y.Z,X.Y,latest} for linux/amd64 and linux/arm64.
# The inherited Rust workspace (Dockerfile at the repo root) is deliberately not built.
# Services build one at a time. Go cross-compiles on the build platform, so no emulation.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        service: [xb-account, xb-auth, xb-gateway, xb-tou, xb-dns, xb-enroll, xb-social]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/openpak/${{ matrix.service }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile.${{ matrix.service }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - run: echo "${{ matrix.service }} ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
